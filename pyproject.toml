[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eternalchat"
version = "0.1.0"
description = "One persistent chat, with a bounded tree of memories"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eternalchat = "eternalchat.cli:main"

[tool.setuptools.packages.find]
include = ["eternalchat*"]

[tool.setuptools.package-data]
eternalchat = ["web.html"]
